name: Continuous Delivery

on:
  push:
    branches: [ cd ]
  pull_request:
    branches: [ cd ]
  workflow_dispatch:

env:
  CR_PAT: ${{ secrets.CR_PAT_2 }}
  DOCKER_GITHUB_USERNAME: ${{ secrets.DOCKER_GITHUB_USERNAME }}
  ENV_GREETING: ${{ secrets.ENV_GREETING }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out Repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      run: echo ${{ env.CR_PAT }} | docker login ghcr.io -u ${{ env.DOCKER_GITHUB_USERNAME }} --password-stdin

    - name: Build and Push Docker Images
      working-directory: ./src
      run: |
        export DOCKER_GITHUB_USERNAME=${{ env.DOCKER_GITHUB_USERNAME }}
        docker buildx bake -f docker-compose.prod.yml --set *.platform=linux/amd64,linux/arm64 --provenance=false --push
